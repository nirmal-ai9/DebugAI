
name: "Bug Report"
description: "Report a reproducible problem with DebugAI."
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DebugAI!
        Please provide accurate information so we can investigate the issue.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where did you encounter the problem?
      options:
        - Code Analysis
        - AI Diagnosis
        - Suggested Fix
        - Code Patching
        - User Interface
        - API / Backend
        - Authentication / Access
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Impact
      description: How much does this issue affect usage?
      options:
        - Critical - Core functionality unavailable
        - High - Major functionality affected
        - Medium - Functionality partially affected
        - Low - Minor inconvenience
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Always
        - Frequently
        - Sometimes
        - Happened only once
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe what went wrong.
      placeholder: "When I..., DebugAI..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the minimum steps needed to reproduce the issue.
      placeholder: |
        1. Open...
        2. Enter...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Other
        - Not applicable
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: "e.g. Windows 11, Android 16, macOS"

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Optional screenshots, console errors, or relevant logs.
      placeholder: "Remove API keys, tokens, passwords and private information before sharing."

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I checked that a similar issue has not already been reported.
          required: true
        - label: I have removed sensitive information from the report.
          required: true
