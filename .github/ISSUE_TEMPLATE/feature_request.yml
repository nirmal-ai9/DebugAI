
name: "Feature Request"
description: "Suggest an improvement or new capability for DebugAI."
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make DebugAI better?
        Tell us what problem it solves and how it would improve the experience.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      description: Which part of DebugAI would this improve?
      options:
        - AI Diagnosis
        - Code Analysis
        - Suggested Fixes
        - Code Patching
        - User Interface / UX
        - Performance
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - New functionality
        - Improvement to existing functionality
        - Workflow improvement
        - Accessibility improvement
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: Describe your idea in one sentence.
      placeholder: "Add..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or user problem would this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you imagine this feature working.
    validations:
      required: true

  - type: dropdown
    id: benefit
    attributes:
      label: Expected impact
      options:
        - Major improvement to usability
        - Better debugging accuracy
        - Improved performance
        - Better accessibility
        - Developer productivity
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Optional. Mention existing approaches or examples.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I checked that this feature has not already been requested.
          required: true
        - label: This suggestion is related to DebugAI.
          required: true
